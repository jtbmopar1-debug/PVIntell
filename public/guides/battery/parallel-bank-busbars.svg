<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d">
  <title id="t">Parallel batteries connected to common busbars</title><desc id="d">Three batteries each connect with equal positive and negative paths to covered busbars.</desc>
  <rect width="900" height="520" rx="36" fill="#f4f8fb"/>
  <g font-family="Arial,sans-serif" font-weight="700" text-anchor="middle">
    <rect x="75" y="80" width="750" height="55" rx="18" fill="#d94b48"/><text x="450" y="115" font-size="22" fill="white">POSITIVE BUSBAR</text>
    <rect x="75" y="385" width="750" height="55" rx="18" fill="#263746"/><text x="450" y="420" font-size="22" fill="white">NEGATIVE BUSBAR</text>
    <g stroke-width="8" fill="white">
      <g stroke="#d94b48"><path d="M235 135v95"/><path d="M450 135v95"/><path d="M665 135v95"/></g>
      <g stroke="#263746"><path d="M235 330v55"/><path d="M450 330v55"/><path d="M665 330v55"/></g>
    </g>
    <g fill="#fff" stroke="#91a7b8" stroke-width="5">
      <rect x="155" y="220" width="160" height="120" rx="16"/><rect x="370" y="220" width="160" height="120" rx="16"/><rect x="585" y="220" width="160" height="120" rx="16"/>
    </g>
    <g font-size="20" fill="#15324d"><text x="235" y="290">BATTERY 1</text><text x="450" y="290">BATTERY 2</text><text x="665" y="290">BATTERY 3</text></g>
    <g><circle cx="205" cy="232" r="10" fill="#d94b48"/><circle cx="265" cy="232" r="10" fill="#263746"/><circle cx="420" cy="232" r="10" fill="#d94b48"/><circle cx="480" cy="232" r="10" fill="#263746"/><circle cx="635" cy="232" r="10" fill="#d94b48"/><circle cx="695" cy="232" r="10" fill="#263746"/></g>
  </g>
</svg>
