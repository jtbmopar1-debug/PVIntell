    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#eef4f7"/><stop offset=".5" stop-color="#aebfca"/><stop offset="1" stop-color="#617685"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#17324d" flood-opacity=".2"/></filter>
  </defs>
  <rect width="900" height="520" rx="36" fill="#f4f8fb"/>
  <g filter="url(#shadow)">
    <path d="M55 182h365v160H55z" fill="url(#metal)" stroke="#526979" stroke-width="6"/>
    <path d="M480 182h365v160H480z" fill="url(#metal)" stroke="#526979" stroke-width="6"/>
    <path d="M320 218h260v88H320z" fill="#e5a82d" stroke="#9a6910" stroke-width="6"/>
    <circle cx="365" cy="262" r="13" fill="#174f80"/><circle cx="535" cy="262" r="13" fill="#174f80"/>
  </g>
