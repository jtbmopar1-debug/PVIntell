<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Close-coupled thermosiphon solar water heater</title><desc id="desc">A horizontal storage tank sits above a roof collector so warmed fluid rises without a pump.</desc><rect width="900" height="560" rx="30" fill="#f4f8fb"/><path d="M70 420 430 150l395 270" fill="#dfe8ee" stroke="#173f63" stroke-width="15"/><g transform="translate(275 220) rotate(-8)"><rect width="370" height="190" rx="14" fill="#214f66" stroke="#173f63" stroke-width="14"/><path d="M45 20v150M100 20v150M155 20v150M210 20v150M265 20v150M320 20v150" stroke="#d95e43" stroke-width="9"/></g><g transform="translate(255 105)"><rect width="410" height="130" rx="65" fill="#fff" stroke="#173f63" stroke-width="14"/><ellipse cx="65" cy="65" rx="45" ry="48" fill="#d9edf4"/><text x="235" y="74" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#173f63">ROOF TANK</text></g><path d="M355 250c-15-65 15-70 35-92M570 185c30 35 38 63 23 95" fill="none" stroke="#d95e43" stroke-width="13"/><path d="m382 162 10-28 18 24M580 272l16 27 13-28" fill="#d95e43"/><text x="450" y="505" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#173f63">NATURAL CIRCULATION — NO PUMP</text></svg>
