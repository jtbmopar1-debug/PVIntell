<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820">
  <rect width="1200" height="820" fill="#f4f1eb"/>
  <style>
    .title{font:800 31px Arial,sans-serif;fill:#10213d}.sub{font:500 17px Arial,sans-serif;fill:#617089}.name{font:800 24px Arial,sans-serif;fill:#10213d}.desc{font:500 15px Arial,sans-serif;fill:#617089}.tag{font:700 11px Arial,sans-serif;letter-spacing:2.5px;fill:#a65739}.card{fill:#fffdf8;stroke:#d8e0e8;stroke-width:2}.navy{fill:#14233f}.coral{fill:#ff7f5c}.gold{stroke:#ffc774}.aqua{stroke:#42d1c2}.cream{stroke:#fff8ee}
  </style>
  <text x="52" y="55" class="title">PVIntell logo directions</text>
  <text x="52" y="84" class="sub">Four simple marks designed to remain clear as a phone icon.</text>

  <g transform="translate(52 120)">
    <rect width="530" height="300" rx="28" class="card"/>
    <g transform="translate(36 36)">
      <rect width="150" height="150" rx="39" class="navy"/>
      <g fill="none" class="gold" stroke-linecap="round" stroke-width="5"><path d="M69 23v15"/><path d="M23 76h15"/><path d="M112 76h15"/><path d="M69 113v14"/></g>
      <path d="M69 43a34 34 0 1 0 22 60l17 8-8-17a34 34 0 0 0-31-51Z" class="coral"/>
      <path d="m52 75 12 12 23-27" fill="none" class="cream" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
      <path d="m99 50 19-19" fill="none" class="aqua" stroke-linecap="round" stroke-width="5"/><circle cx="123" cy="26" r="6" fill="#42d1c2"/>
    </g>
    <text x="220" y="68" class="tag">OPTION A</text><text x="220" y="104" class="name">Solar Answer</text>
    <text x="220" y="135" class="desc">Sun + speech bubble + answer tick</text><text x="220" y="160" class="desc">with a circuit node for intelligence.</text>
    <text x="36" y="236" class="name">PVIntell</text><text x="36" y="261" class="tag">SOLAR. ANSWERED.</text>
  </g>

  <g transform="translate(618 120)">
    <rect width="530" height="300" rx="28" class="card"/>
    <g transform="translate(36 36)">
      <rect width="150" height="150" rx="39" class="navy"/>
      <circle cx="75" cy="75" r="27" class="coral"/>
      <path d="M30 82c8-39 43-59 78-43 19 9 27 29 22 47" fill="none" class="aqua" stroke-linecap="round" stroke-width="5"/>
      <circle cx="31" cy="82" r="6" fill="#42d1c2"/><circle cx="130" cy="86" r="6" fill="#42d1c2"/>
      <path d="M75 29v11M75 110v11M29 75h11M110 75h11" fill="none" class="gold" stroke-linecap="round" stroke-width="5"/>
      <path d="m65 75 8 8 15-18" fill="none" class="cream" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
    </g>
    <text x="220" y="68" class="tag">OPTION B</text><text x="220" y="104" class="name">Wattson Orbit</text>
    <text x="220" y="135" class="desc">A solar core wrapped by a connected</text><text x="220" y="160" class="desc">knowledge path and confirmed answer.</text>
    <text x="36" y="236" class="name">PVIntell</text><text x="36" y="261" class="tag">KNOW YOUR POWER.</text>
  </g>

  <g transform="translate(52 456)">
    <rect width="530" height="300" rx="28" class="card"/>
    <g transform="translate(36 36)">
      <rect width="150" height="150" rx="39" class="navy"/>
      <path d="M34 83h82l-10 38H25Z" fill="#2f82bd" stroke="#75cbea" stroke-width="3"/>
      <path d="M47 83 42 121M69 83l-2 38M92 83l3 38M29 102h82" fill="none" stroke="#bfeafb" stroke-width="2"/>
      <path d="M52 83a29 29 0 0 1 58 0Z" class="coral"/>
      <path d="M82 28v13M43 48l10 9M121 48l-10 9" fill="none" class="gold" stroke-linecap="round" stroke-width="5"/>
      <path d="m105 39 12-12" fill="none" class="aqua" stroke-linecap="round" stroke-width="5"/><circle cx="121" cy="23" r="6" fill="#42d1c2"/>
    </g>
    <text x="220" y="68" class="tag">OPTION C</text><text x="220" y="104" class="name">Panel Sunrise</text>
    <text x="220" y="135" class="desc">The clearest solar-system mark:</text><text x="220" y="160" class="desc">panel, sunrise and connected insight.</text>
    <text x="36" y="236" class="name">PVIntell</text><text x="36" y="261" class="tag">BUILD SMARTER SOLAR.</text>
  </g>

  <g transform="translate(618 456)">
    <rect width="530" height="300" rx="28" class="card"/>
    <g transform="translate(36 36)">
      <rect width="150" height="150" rx="39" class="navy"/>
      <circle cx="75" cy="75" r="37" fill="none" class="gold" stroke-width="5"/>
      <path d="M75 27v14M75 109v14M27 75h14M109 75h14" fill="none" class="gold" stroke-linecap="round" stroke-width="5"/>
      <circle cx="75" cy="75" r="25" class="coral"/>
      <path d="m63 87 28-28" fill="none" class="aqua" stroke-linecap="round" stroke-width="7"/>
      <circle cx="94" cy="56" r="7" fill="#42d1c2"/>
      <path d="M58 92h14M65 85v14" fill="none" class="cream" stroke-linecap="round" stroke-width="4"/>
    </g>
    <text x="220" y="68" class="tag">OPTION D</text><text x="220" y="104" class="name">DIY Solar Compass</text>
    <text x="220" y="135" class="desc">Direction, practical adjustment and</text><text x="220" y="160" class="desc">a bright target for better output.</text>
    <text x="36" y="236" class="name">PVIntell</text><text x="36" y="261" class="tag">PLAN. BUILD. UNDERSTAND.</text>
  </g>
</svg>
