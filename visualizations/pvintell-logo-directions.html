<div id="pvintell-logo-drafts">
  <style>
    #pvintell-logo-drafts { color: var(--foreground); }
    #pvintell-logo-drafts .drafts { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-top:16px; }
    #pvintell-logo-drafts .option { min-height:190px; padding:22px; text-align:left; }
    #pvintell-logo-drafts .option[data-selected="true"] { box-shadow:0 0 0 3px var(--accent); }
    #pvintell-logo-drafts .lockup { display:flex; align-items:center; gap:12px; margin-bottom:22px; }
    #pvintell-logo-drafts .word { font-weight:500; font-size:22px; letter-spacing:-1px; white-space:nowrap; }
    #pvintell-logo-drafts .word span { color:var(--blue); }
    #pvintell-logo-drafts .tag { color:var(--muted-foreground); font-size:11px; letter-spacing:1.4px; text-transform:uppercase; }
    #pvintell-logo-drafts .mark { position:relative; width:48px; height:48px; flex:none; overflow:hidden; border-radius:14px; background:var(--primary); color:var(--primary-foreground); }
    #pvintell-logo-drafts .sun { position:absolute; width:13px; height:13px; border-radius:50%; background:var(--yellow); }
    #pvintell-logo-drafts .panel { position:absolute; background:var(--blue); transform:skew(-10deg); }
    #pvintell-logo-drafts .panel:before,#pvintell-logo-drafts .panel:after { content:""; position:absolute; background:color-mix(in srgb,var(--primary-foreground) 72%,transparent); }
    #pvintell-logo-drafts .panel:before { inset:0 auto 0 50%; width:1px; }
    #pvintell-logo-drafts .panel:after { inset:50% 0 auto 0; height:1px; }
    #pvintell-logo-drafts .a .sun { left:9px; top:8px; }
    #pvintell-logo-drafts .a .panel { width:31px; height:22px; right:6px; bottom:7px; }
    #pvintell-logo-drafts .b .mark { border-radius:50%; background:var(--yellow); }
    #pvintell-logo-drafts .b .panel { width:34px; height:25px; left:7px; bottom:5px; background:var(--primary); }
    #pvintell-logo-drafts .b .sun { width:8px; height:8px; right:8px; top:8px; background:var(--orange); }
    #pvintell-logo-drafts .c .mark { display:grid; place-items:center; background:var(--blue); }
    #pvintell-logo-drafts .monogram { font-weight:500; font-size:21px; letter-spacing:-2px; transform:translateX(-1px); }
    #pvintell-logo-drafts .c .sun { width:7px; height:7px; right:7px; top:7px; }
    #pvintell-logo-drafts .label { display:block; font-weight:500; margin-bottom:5px; }
    #pvintell-logo-drafts .note { display:block; color:var(--muted-foreground); }
    @media (max-width:700px) { #pvintell-logo-drafts .drafts { grid-template-columns:1fr; } }
  </style>
  <h2>PVIntell logo directions</h2>
  <div class="drafts">
    <button class="btn viz-tile option a" type="button" data-choice="sun-panel" data-selected="true" aria-pressed="true">
      <span class="lockup"><span class="mark"><span class="sun"></span><span class="panel"></span></span><span><span class="word">PV<span>Intell</span></span><span class="tag">Your solar. Answered.</span></span></span>
      <span class="label">A. Sun + panel</span><span class="note">Simple, unmistakably solar and clear at small sizes. My pick.</span>
    </button>
    <button class="btn viz-tile option b" type="button" data-choice="solar-orbit" data-selected="false" aria-pressed="false">
      <span class="lockup"><span class="mark"><span class="sun"></span><span class="panel"></span></span><span><span class="word">PV<span>Intell</span></span><span class="tag">Your solar. Answered.</span></span></span>
      <span class="label">B. Solar orbit</span><span class="note">More playful and distinctive, with a stronger app-icon silhouette.</span>
    </button>
    <button class="btn viz-tile option c" type="button" data-choice="pv-monogram" data-selected="false" aria-pressed="false">
      <span class="lockup"><span class="mark"><span class="monogram">PV</span><span class="sun"></span></span><span><span class="word">PV<span>Intell</span></span><span class="tag">Your solar. Answered.</span></span></span>
      <span class="label">C. PV monogram</span><span class="note">The cleanest tech brand, but less obviously solar without the wordmark.</span>
    </button>
  </div>
  <script>
    const root = document.getElementById('pvintell-logo-drafts');
    const state = { direction: 'sun-panel' };
    function render() {
      root.querySelectorAll('[data-choice]').forEach((option) => {
        const selected = option.dataset.choice === state.direction;
        option.dataset.selected = String(selected);
        option.setAttribute('aria-pressed', String(selected));
      });
    }
    root.querySelectorAll('[data-choice]').forEach((option) => option.addEventListener('click', () => { state.direction = option.dataset.choice; render(); }));
    render();
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: root, onChange: render });
      tweak.addSelect(state, 'direction', { label: 'Logo direction', options: [{ label: 'Sun + panel', value: 'sun-panel' }, { label: 'Solar orbit', value: 'solar-orbit' }, { label: 'PV monogram', value: 'pv-monogram' }], reference: 'brand.direction' });
    }
  </script>
</div>
